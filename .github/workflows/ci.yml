name: Python CI Pipeline

on:
  push:
  pull_request:

jobs:
  lint-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-tools

          pip-compile requirements.in
          pip-compile requirements-dev.in
          pip-sync requirements.txt requirements-dev.txt

      # --- ЖОРСТКІ ПЕРЕВІРКИ (Блокують злиття коду) ---

      - name: Check dependencies with Deptry
        run: deptry .

      - name: Ruff - Hard Errors Only
        run: ruff check . --select E9,F --output-format=github

      # --- Перевірки, що не блокують CI, просто показують попередження ---

      - name: Ruff - Style Recommendations
        # --exit-zero гарантує, що крок завжди завершується успішно для GitHub,
        # але всі зауваження до стилю виведуться в логи.
        run: ruff check . --exit-zero --output-format=github

      - name: Type check with MyPy
        run: mypy . --ignore-missing-imports
        # Цей параметр каже GitHub Actions ігнорувати помилку кроку
        # Пайплайн піде далі і буде світитися зеленим, навіть якщо є проблеми з типами.
        continue-on-error: true
