# --- НАЛАШТУВАННЯ RUFF (Лінтер та Форматер) ---
[tool.ruff]

target-version = "py311"
# Що ігнорувати
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".git",
    "resources_rc.py",
    "resources.qrc",
    "app/ui/ui_*.py",
]

[tool.ruff.lint]
# Базові правила:
# E, W - помилки та попередження стилю
# F - логічні помилки (невикористані змінні, погані імпорти)
# I - автоматичне сортування імпортів 
select = ["E", "F", "W", "I"]

# ВИМИКАЄМО ПЕРЕВІРКУ НА ДОВЖИНУ РЯДКА (E501)
ignore = ["E501"]

# --- НАЛАШТУВАННЯ MYPY (Типізація) ---
[tool.mypy]
python_version = "3.11"
exclude = [".venv", "venv"]

ignore_missing_imports = true
explicit_package_bases = true

# --- НАЛАШТУВАННЯ DEPTRY (Залежності) ---
[tool.deptry]
extend_exclude = [".venv", "venv"]

[tool.deptry.per_rule_ignores]
DEP002 = ["bcrypt", "python-xlib"]

[tool.deptry.package_module_name_map]
pywin32 = ["win32api", "win32gui", "win32con"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
timeout = 15